<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sign in | FreshFold')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="auth-shell"><section class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p class="muted">Your laundry plans are right where you left them.</p><div th:if="${param.error}" class="alert error">Email or password is incorrect.</div><div th:if="${param.logout}" class="alert success">You have signed out.</div><div th:if="${param.registered}" class="alert success">Account created. Sign in to get started.</div><form method="post" th:action="@{/login}"><label>Email address<input type="email" name="username" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button full">Sign in <span>→</span></button></form><p class="auth-bottom">New to FreshFold? <a href="/register">Create an account</a></p></section></main></body></html>
