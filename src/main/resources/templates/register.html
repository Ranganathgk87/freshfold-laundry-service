<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account | FreshFold','Create a FreshFold account to book laundry pickup and follow order updates.','noindex,nofollow','')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="auth-shell"><section class="auth-card">
  <span class="eyebrow">GET STARTED</span><h1>Create account</h1><p class="muted">A few details and your first pickup is on its way.</p>
  <form method="post" th:action="@{/register}" th:object="${account}">
    <label>Full name<input th:field="*{name}" required maxlength="100"><small th:errors="*{name}"></small></label>
    <label>Email address<input type="email" th:field="*{email}" required><small th:errors="*{email}"></small></label>
    <label>Phone number<input th:field="*{phone}" maxlength="30"></label>
    <label>Home address<textarea th:field="*{address}" maxlength="500" rows="2"></textarea></label>
    <label>Password<input type="password" th:field="*{password}" required minlength="8" autocomplete="new-password"><small th:errors="*{password}"></small></label>
    <label>Confirm password<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label>
    <button class="button full">Create my account <span>→</span></button>
  </form>
  <p class="auth-bottom">Already registered? <a href="/login">Sign in</a></p>
</section></main>
</body>
</html>
